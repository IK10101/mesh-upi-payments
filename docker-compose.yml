services:
  postgres:
    image: postgres
    container_name: mesh-postgres
    environment:
      POSTGRES_PASSWORD: newSecurePass456xyz
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  redis:
    image: redis
    container_name: mesh-redis
    ports:
      - "6379:6379"

volumes:
  postgres-data: